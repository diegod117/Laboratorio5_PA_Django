<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sitio de currículums del grupo - Laboratorio 5 Django">
    <title>{% block title %}Sitio CV{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'home' %}" class="brand">Sitio<span>CV</span></a>
            <nav class="nav" aria-label="Navegación principal">
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'cv_ejemplo' %}">CV de ejemplo</a>
            </nav>
        </div>
    </header>

    <main class="container main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            Programación de Aplicaciones — Unidad III — Laboratorio 5
        </div>
    </footer>
</body>
</html>
